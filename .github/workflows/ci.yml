name: CI - Continuous Integration

on:
  push:
    branches:
      - feature-projeto
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Executar testes unitarios
        run: python -m unittest test_mensagens.py

      - name: Verificar sintaxe dos arquivos Python
        run: |
          python -m py_compile app.py
          python -m py_compile mensagens.py

      - name: CI concluido
        run: echo "Continuous Integration executado com sucesso!"
